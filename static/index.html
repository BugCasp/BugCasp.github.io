<script>
/* =========================================================================
   STATE
   ========================================================================= */
const state = {
  token: localStorage.getItem('bb_token') || null,
  role: localStorage.getItem('bb_role') || null,
  user: null,
  view: 'home',
  programs: [],
  myPrograms: [],
  myReports: [],
  leaderboard: [],
  pendingCompanies: [],
  pendingPrograms: [],
  allReports: [],
  analytics: null,
  selectedProgram: null,
  selectedProgramReports: [],
};

/* =========================================================================
   API HELPER
   ========================================================================= */
async function api(path, { method = 'GET', body = null, auth = true } = {}) {
  const headers = {};

  if (auth && state.token) {
    headers['Authorization'] = `Bearer ${state.token}`;
  }

  let requestBody = undefined;

  if (body instanceof FormData) {
    // File upload üçün FormData olduğu kimi göndərilir.
    // Content-Type yazmırıq — browser özü multipart/form-data boundary əlavə edir.
    requestBody = body;
  } else if (body !== null && body !== undefined) {
    headers['Content-Type'] = 'application/json';
    requestBody = JSON.stringify(body);
  }

  const res = await fetch(path, {
    method,
    headers,
    body: requestBody,
  });

  let data = null;

  try {
    data = await res.json();
  } catch (e) {
    data = null;
  }

  if (!res.ok) {
    const msg = data && data.detail
      ? (
          typeof data.detail === 'string'
            ? data.detail
            : JSON.stringify(data.detail)
        )
      : `Request failed (${res.status})`;

    throw new Error(msg);
  }

  return data;
}

function toast(message, type = 'info') {
  const colors = {
    info: 'bg-slate-800 border-slate-700',
    success: 'bg-emerald-900 border-emerald-700',
    error: 'bg-red-900 border-red-700',
  };
  const el = document.createElement('div');
  el.className = `fade-in border ${colors[type]} text-sm text-slate-100 px-4 py-3 rounded-lg shadow-lg max-w-sm`;
  el.textContent = message;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

/* =========================================================================
   AUTH
   ========================================================================= */
function setSession(token, role) {
  state.token = token;
  state.role = role;
  localStorage.setItem('bb_token', token);
  localStorage.setItem('bb_role', role);
}

function logout() {
  state.token = null;
  state.role = null;
  state.user = null;
  localStorage.removeItem('bb_token');
  localStorage.removeItem('bb_role');
  navigate('home');
  toast('Logged out', 'info');
}

async function loadMe() {
  if (!state.token) { state.user = null; return; }
  try {
    state.user = await api('/api/auth/me');
  } catch (e) {
    logout();
  }
}

async function doLogin(username, password) {
  try {
    const data = await api('/api/auth/login', { method: 'POST', body: { username, password }, auth: false });
    setSession(data.access_token, data.role);
    await loadMe();
    closeModal();
    toast(`Welcome back, ${username}!`, 'success');
    navigate(defaultViewForRole(state.role));
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function doRegisterHacker(payload) {
  try {
    const data = await api('/api/auth/register', { method: 'POST', body: { account_type: 'hacker', ...payload }, auth: false });
    setSession(data.access_token, data.role);
    await loadMe();
    closeModal();
    toast('Hacker account created! Welcome aboard.', 'success');
    navigate('hacker-hub');
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function doRegisterCompany(payload) {
  try {
    const data = await api('/api/auth/register', { method: 'POST', body: { account_type: 'company', ...payload }, auth: false });
    setSession(data.access_token, data.role);
    await loadMe();
    closeModal();
    toast('Company account created! Awaiting SuperAdmin approval.', 'success');
    navigate('company-dashboard');
  } catch (e) {
    toast(e.message, 'error');
  }
}

function defaultViewForRole(role) {
  if (role === 'superadmin') return 'admin-dashboard';
  if (role === 'company') return 'company-dashboard';
  if (role === 'hacker') return 'hacker-hub';
  return 'home';
}

/* =========================================================================
   ROUTER
   ========================================================================= */
async function navigate(view) {
  state.view = view;
  render();
  try {
    if (view === 'home' || view === 'leaderboard') {
      state.leaderboard = await api('/api/hacker/leaderboard', { auth: false });
    }
    if (view === 'hacker-hub') {
      state.programs = await api('/api/hacker/programs', { auth: false });
      state.myReports = state.token ? await api('/api/hacker/my-reports') : [];
    }
    if (view === 'company-dashboard') {
      state.myPrograms = await api('/api/company/my-programs');
    }
    if (view === 'admin-dashboard') {
      const [pc, pp, ar, an] = await Promise.all([
        api('/api/admin/pending-companies'),
        api('/api/admin/pending-programs'),
        api('/api/admin/all-reports'),
        api('/api/admin/analytics'),
      ]);
      state.pendingCompanies = pc;
      state.pendingPrograms = pp;
      state.allReports = ar;
      state.analytics = an;
    }
  } catch (e) {
    toast(e.message, 'error');
  }
  render();
}

async function updateReportStatus(reportId, selectEl) {
  const status = selectEl.value;
  try {
    await api(`/api/company/reports/${reportId}/status`, { method: 'PUT', body: { status } });
    toast(`Report #${reportId} marked as ${status}`, 'success');
    const badge = document.getElementById(`status-badge-${reportId}`);

      badge.className = `px-2 py-1 rounded-full text-xs font-semibold status-${status.replace(/\s/g, '')}`;
      badge.textContent = status;
    }
  } catch (e) {
    toast(e.message, 'error');
  }
}

function openSubmitReportModal(programId, programTitle) {
  openModal(`
    <div class="p-6">

      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold">Submit Report</h2>

        <button
          onclick="closeModal()"
          class="text-slate-400 hover:text-white"
        >
          ✕
        </button>
      </div>

      <p class="text-sm text-slate-400 mb-3">
        Target:
        <span class="text-slate-200">
          ${escapeHtml(programTitle)}
        </span>
      </p>

      <form id="submit-report-form" class="space-y-3">

        <input
          required
          name="title"
          placeholder="Vulnerability Title"
          class="input"
        />

        <input
          required
          name="cwe_category"
          placeholder="CWE / OWASP Category"
          class="input"
        />

        <div class="grid grid-cols-2 gap-2">

          <select required name="severity" class="input">
            <option value="">Severity...</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>

          <input
            required
            name="cvss_score"
            type="number"
            step="0.1"
            min="0"
            max="10"
            placeholder="CVSS v3 Score (0-10)"
            class="input"
          />

        </div>

        <!-- DRAG & DROP -->

        <div
          id="report-drop-zone"
          class="border-2 border-dashed border-slate-700
                 rounded-xl p-8 text-center cursor-pointer
                 transition hover:border-emerald-500
                 hover:bg-slate-800/50"
        >

          <div class="text-4xl mb-3">📄</div>

          <p class="text-slate-200 font-semibold">
            Drag & Drop Report File
          </p>

          <p class="text-sm text-slate-500 mt-2">
            or click to select a file
          </p>

          <p class="text-xs text-slate-600 mt-3">
            TXT · MD · JSON · PDF
          </p>

          <input
            id="report-file"
            type="file"
            hidden
            accept=".txt,.md,.json,.pdf"
          />

        </div>

        <div
          id="selected-report-file"
          class="hidden bg-slate-900 border border-slate-800
                 rounded-lg p-3"
        ></div>

        <div
          id="report-file-error"
          class="hidden text-sm text-red-400"
        ></div>

        <button
          type="submit"
          class="w-full bg-emerald-600 hover:bg-emerald-500
                 transition rounded-lg py-2 font-semibold"
        >
          Submit Report
        </button>

      </form>
    </div>
  `);

  addInputClasses();

  const form = document.getElementById('submit-report-form');
  const dropZone = document.getElementById('report-drop-zone');
  const fileInput = document.getElementById('report-file');
  const selectedFile = document.getElementById('selected-report-file');
  const fileError = document.getElementById('report-file-error');

  let reportFile = null;
  let uploadedEvidence = null;

  const allowedExtensions = [
    '.txt',
    '.md',
    '.json',
    '.pdf'
  ];

  function showFileError(message) {
    fileError.textContent = message;
    fileError.classList.remove('hidden');

    selectedFile.classList.add('hidden');

    reportFile = null;
    uploadedEvidence = null;
  }

  function clearFileError() {
    fileError.textContent = '';
    fileError.classList.add('hidden');
  }

  function selectReportFile(file) {
    clearFileError();

    if (!file) return;

    const extension =
      '.' + file.name.split('.').pop().toLowerCase();

    if (!allowedExtensions.includes(extension)) {
      showFileError(
        'This file type is not allowed.'
      );
      return;
    }

    reportFile = file;

    selectedFile.innerHTML = `
      <div class="flex items-center justify-between gap-3">

        <div class="flex items-center gap-3 min-w-0">

          <span class="text-2xl">📎</span>

          <div class="min-w-0">

            <p class="text-sm text-slate-200 truncate">
              ${escapeHtml(file.name)}
            </p>

            <p class="text-xs text-slate-500">
              ${(file.size / 1024).toFixed(1)} KB
            </p>

          </div>

        </div>

        <span class="text-xs text-emerald-400">
          Ready
        </span>

      </div>
    `;

    selectedFile.classList.remove('hidden');
  }

  dropZone.addEventListener('click', () => {
    fileInput.click();
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
      selectReportFile(fileInput.files[0]);
    }
  });

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();

    dropZone.classList.add(
      'border-emerald-500',
      'bg-slate-800'
    );
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove(
      'border-emerald-500',
      'bg-slate-800'
    );
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();

    dropZone.classList.remove(
      'border-emerald-500',
      'bg-slate-800'
    );

    const file = e.dataTransfer.files[0];

    if (file) {
      selectReportFile(file);
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    clearFileError();

    if (!reportFile) {
      showFileError(
        'Please attach a report file first.'
      );
      return;
    }

    try {

      /*
       * STEP 1
       * Upload evidence file
       */

      const fileData = new FormData();

      fileData.append(
        'file',
        reportFile
      );

      uploadedEvidence = await api(
        '/api/hacker/reports/upload',
        {
          method: 'POST',
          body: fileData
        }
      );


      /*
       * STEP 2
       * Submit report
       */

      const payload = {
        program_id: programId,
        title: form.elements.title.value,
        cwe_category: form.elements.cwe_category.value,
        severity: form.elements.severity.value,
        cvss_score: parseFloat(form.elements.cvss_score.value),

  // File əsas report olduğu üçün backend-in tələb etdiyi minimum mətn
        impact_analysis: 'See attached report.',
        poc_steps: 'See attached report.',
        http_payload: '',

        evidence_path: uploadedEvidence.evidence_path,
        evidence_filename: uploadedEvidence.evidence_filename
};


      await api(
        '/api/hacker/reports',
        {
          method: 'POST',
          body: payload
        }
      );


      closeModal();

      toast(
        'Report submitted. Good hunting!',
        'success'
      );

      navigate('hacker-hub');

    } catch (err) {

      toast(
        err.message,
        'error'
      );

    }
  });
}

/* =========================================================================
   UTIL
   ========================================================================= */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str) { return escapeHtml(str).replace(/'/g, '&#39;'); }

function severityBadge(sev) {
  const cls = { Low: 'badge-low', Medium: 'badge-medium', High: 'badge-high', Critical: 'badge-critical' }[sev] || 'badge-low';
  return `<span class="px-2 py-1 rounded-full text-xs font-semibold ${cls}">${sev}</span>`;
}

function statusBadgeClass(status) { return `status-${status.replace(/\s/g, '')}`; }

function timeAgo(iso) {
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}
